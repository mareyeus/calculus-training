<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papa's Hot Doggeria</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#16121f}body{display:grid;place-items:center}#waflashContainer{width:100vw;height:100vh;display:grid;place-items:center;background:#16121f}canvas.waflashCanvas{display:block;width:100%;height:100%;max-width:100vw;max-height:100vh;object-fit:contain;outline:0;touch-action:none}#waflashStatus{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:#201735;padding:12px 18px;border-radius:10px;font:600 15px system-ui;z-index:2}
</style>
</head>
<body>
<div id="waflashContainer">
<canvas class="waflashCanvas" id="canvas" tabindex="1"></canvas>
<div id="waflashStatus">Loading game…</div>
</div>
<script type="module">
import { createWaflash } from './js/waflash-player.min.js';
const canvas=document.getElementById('canvas');
canvas.addEventListener('keydown',e=>e.stopPropagation());
canvas.addEventListener('click',()=>canvas.focus());
canvas.focus();
createWaflash(new URL('./swf/papashotdoggeria.swf',location.href).href,window.wafOptions||{});
</script>
</body>
</html>
