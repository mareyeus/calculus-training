<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Death Run 3D</title>
  <link rel="stylesheet" href="TemplateData56/style.css">
  <script src="TemplateData56/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231f20; }
    .webgl-content, #gameContainer { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="webgl-content"><div id="gameContainer"></div></div>
  <script>
    window.addEventListener('keydown', function (event) {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(event.key)) event.preventDefault();
    }, { passive: false });
    var gameInstance = UnityLoader.instantiate('gameContainer', 'Build/death_run_wasm_v1.json', {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function () {
          UnityProgress(gameInstance, 'complete');
        }
      }
    });
  </script>
</body>
</html>
